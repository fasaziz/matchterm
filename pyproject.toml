[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "matchterm"
version = "0.1.2"
description = "An offline terminal football season simulator"
requires-python = ">=3.11"
dependencies = ["textual==1.0.0"]
[project.scripts]
matchterm = "matchterm.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
matchterm = ["data/*.json"]
