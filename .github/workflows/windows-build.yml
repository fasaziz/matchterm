name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.22.3
      - name: Test simulation and saves
        run: python -m unittest discover -s tests -p test_engine.py
      - name: Test terminal controls
        run: python tests/test_ui.py
      - name: Build bundled executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name matchterm --collect-data matchterm --collect-all textual
          --copy-metadata textual packaging/entrypoint.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          & .\dist\matchterm\matchterm.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke test failed.' }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not found.' }
          & $compiler packaging\matchterm.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Add checksum
        shell: pwsh
        run: |
          Get-ChildItem installer-output\*.exe | ForEach-Object {
            $sum = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$sum  $($_.Name)" | Set-Content ($_.FullName + '.sha256')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHTERM-Windows-installer
          path: installer-output/*
          retention-days: 14
          if-no-files-found: error
